# Builds every archive without publishing anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-amd64, darwin-arm64, linux-amd64, linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # LLVM, MLIR and Flang outputs need several GB on top of the toolchain.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build
        # Flang and MLIR translation units need 2-3 GB of memory each.
        run: bazel build --jobs=4 //:${{ matrix.platform }}
      - name: Inspect
        run: |
          ls -la bazel-bin/flang-*.tar.zst
          tar --zstd -tvf bazel-bin/flang-${{ matrix.platform }}-*.tar.zst
          df -h /
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: bazel-bin/flang-${{ matrix.platform }}-*.tar.zst
          if-no-files-found: error
          retention-days: 7
